<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="汉字">
<title>Карточки иероглифов</title>
<style>
:root{--bg:#f1f3ec;--sf:#fbfcf8;--ink:#1b2540;--mu:#667088;--jade:#247a68;--red:#c0412b;--ln:#d5d9cb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--sf:#1b2130;--ink:#e8ebf2;--mu:#8f98ad;--jade:#4cb59d;--red:#e2735d;--ln:#313a50}}
:root[data-theme="dark"]{--bg:#12161f;--sf:#1b2130;--ink:#e8ebf2;--mu:#8f98ad;--jade:#4cb59d;--red:#e2735d;--ln:#313a50}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 96px}
.mi{width:230px;height:230px;margin:8px auto 14px;display:grid;place-items:center;border:2px solid var(--red);border-radius:4px;background:
linear-gradient(to right,transparent calc(50% - .5px),var(--ln) 0,var(--ln) calc(50% + .5px),transparent 0),
linear-gradient(to bottom,transparent calc(50% - .5px),var(--ln) 0,var(--ln) calc(50% + .5px),transparent 0),
linear-gradient(45deg,transparent calc(50% - .5px),var(--ln) 0,var(--ln) calc(50% + .5px),transparent 0),
linear-gradient(-45deg,transparent calc(50% - .5px),var(--ln) 0,var(--ln) calc(50% + .5px),transparent 0),var(--sf);cursor:pointer}
.mi span,.zh,.eh{font-family:"Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC",serif}
.mi span,.zh{line-height:1}
.c{text-align:center}.mu{color:var(--mu);font-size:14px}
.pin{font-size:22px;text-align:center;color:var(--jade);min-height:30px}
.tr{font-size:20px;text-align:center;font-weight:600;margin:4px 0 12px}
.ex,.me{background:var(--sf);border-left:3px solid var(--jade);padding:10px 14px;border-radius:4px;margin-top:8px;white-space:pre-wrap}
.me{border-left-color:var(--red)}
.eh{font-size:20px}
.em{text-align:center;color:var(--mu);margin:50px 12px 20px}
.b{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:inherit;font-weight:600;margin-top:10px;text-align:center;cursor:pointer}
.b.s{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.b.dis{opacity:.5;pointer-events:none}
.rt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.rt .b{margin:0;padding:14px 4px}.rt .no{background:var(--red);color:#fff}.rt .hd{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}.rt .ok{background:var(--jade);color:#fff}
.ops{display:grid;gap:8px}
.op{padding:13px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:10px;font:inherit;text-align:left;cursor:pointer}
.op.ok{border-color:var(--jade);background:var(--jade);color:#fff}.op.no{border-color:var(--red);background:var(--red);color:#fff}
details{background:var(--sf);border-radius:10px;padding:12px 14px;margin-top:10px}summary{font-weight:600;cursor:pointer}
input[type=text],select{display:block;width:100%;margin-top:8px;padding:11px;border:1.5px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
select{background:var(--sf);margin:0 0 8px}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}
.li .zh{font-size:26px;min-width:64px}.li div{flex:1;min-width:0}.li button{border:0;background:none;color:var(--mu);font-size:22px;padding:6px 10px;cursor:pointer}
.li input[type=checkbox]{width:22px;height:22px;margin-top:12px}
h2{font-size:15px;margin:20px 0 4px;color:var(--mu);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{border:0;background:none;color:var(--mu);font:inherit;padding:14px 2px;cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--ink);font-weight:600;border-top-color:var(--red)}
#msg{position:fixed;left:16px;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;text-align:center}
button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
</style></head><body>
<main id="v"></main><div id="msg" hidden></div>
<nav><button data-a="tab" data-t="study">Учить</button><button data-a="tab" data-t="quiz">Тест</button><button data-a="tab" data-t="words">Слова</button><button data-a="tab" data-t="chat">Claude</button></nav>
<script>
const K="hz_v2",DAY=864e5,IV=[0,1,3,7,14,30],G="Общая";
let DB={cards:[],decks:[G],deck:"",streak:0,last:"",today:0,key:""};
try{const s=localStorage.getItem(K);if(s)Object.assign(DB,JSON.parse(s));else DB.cards=JSON.parse(localStorage.getItem("hz_cards_v1")||"[]").map(c=>Object.assign({d:G},c))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tab="study",q=[],cur=null,flip=false,S=null,busy="",qz=null,qm="h2t",score=[0,0],pend=null,ef=null,sq="",chat=[],expl="";
const ai=()=>S||DB.key;
const P='Ты помощник по китайскому для русскоязычного студента уровня HSK 4. Верни ТОЛЬКО JSON-массив, без пояснений и без markdown. Каждый элемент: {"h":"иероглифы","p":"пиньинь с тонами","t":"краткий перевод на русский","eh":"простое предложение-пример на китайском","ep":"пиньинь предложения","et":"перевод предложения на русский"}.';
const SYS="Ты репетитор китайского для русскоязычного студента уровня HSK 4. Отвечай по-русски, кратко, иероглифы всегда с пиньинем.";
if(window.claude&&claude.use)claude.use("sample").then(s=>{S=s;render()}).catch(()=>{});
const pool=()=>DB.cards.filter(c=>!DB.deck||c.d==DB.deck);
const fs=h=>[0,130,92,66][h.length]||48;
const day=()=>new Date().toDateString(),yd=()=>new Date(Date.now()-DAY).toDateString();
const st=()=>{const t=DB.last==day();return[t?DB.today:0,t||DB.last==yd()?DB.streak:0]};
function tick(){if(DB.last!=day()){DB.streak=DB.last==yd()?DB.streak+1:1;DB.last=day();DB.today=0}DB.today++}
function mk(o){const d=o.d||DB.deck||G;if(DB.decks.indexOf(d)<0)DB.decks.push(d);return{id:Date.now()+Math.random().toString(36).slice(2,6),h:String(o.h).trim(),p:o.p||"",t:o.t||"",eh:o.eh||"",ep:o.ep||"",et:o.et||"",d:d,box:0,due:0}}
const dup=(h,d)=>DB.cards.some(c=>c.h==String(h).trim()&&c.d==d);
function toast(s){const m=$("#msg");m.textContent=s;m.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>m.hidden=true,3500)}
const err=e=>e.message=="nokey"?"Нужен API-ключ: вкладка «Слова», раздел внизу.":"Не получилось связаться с Claude. Проверь интернет или VPN.";
function sel(){return'<select data-a="dk"><option value="">Все колоды</option>'+DB.decks.map(d=>'<option'+(d==DB.deck?" selected":"")+'>'+esc(d)+'</option>').join("")+'</select>'}
function startStudy(){q=pool().filter(c=>c.due<=Date.now()).sort((a,b)=>a.due-b.due);next()}
function next(){cur=q.shift()||null;flip=false;expl="";render()}
function rate(r){if(!cur)return;tick();if(r==2){cur.box=Math.min(5,cur.box+1);cur.due=Date.now()+IV[cur.box]*DAY}else if(r==1)cur.due=Date.now()+DAY;else{cur.box=0;cur.due=0;q.push(cur)}save();next()}
function study(){const p=pool(),s=st();let h=sel();
if(!p.length)return h+'<p class="em">В этой колоде пока нет карточек. Добавь слова на вкладке «Слова».</p>';
h+='<p class="mu c">Сегодня повторено: '+s[0]+'. Серия: '+s[1]+' дн.</p>';
if(!cur)return h+'<p class="em">На сегодня всё. Карточек в колоде: '+p.length+'.</p><button class="b" data-a="again">Повторить всё</button>';
h+='<div class="mi" data-a="flip"><span style="font-size:'+fs(cur.h)+'px">'+esc(cur.h)+'</span></div>';
if(!flip)return h+'<p class="mu c">Осталось: '+(q.length+1)+'. Нажми на карточку, чтобы перевернуть</p>';
h+='<div class="pin">'+esc(cur.p)+'</div><div class="tr">'+esc(cur.t)+'</div>';
if(cur.eh)h+='<div class="ex"><div class="eh">'+esc(cur.eh)+'</div><div>'+esc(cur.ep)+'</div><div class="mu">'+esc(cur.et)+'</div></div>';
if(expl)h+='<div class="ex">'+esc(expl)+'</div>';
if(ai())h+='<button class="b s'+(busy=="x"?" dis":"")+'" data-a="exp">'+(busy=="x"?"Claude думает…":"Объяснить слово")+'</button>';
return h+'<div class="rt"><button class="b no" data-a="r" data-r="0">Забыл</button><button class="b hd" data-a="r" data-r="1">Сложно</button><button class="b ok" data-a="r" data-r="2">Знаю</button></div>'}
function newQ(){const p=pool(),c=p[Math.random()*p.length|0],k=qm=="t2h"?"h":"t";qz={c:c,o:[c].concat(p.filter(x=>x.id!=c.id&&x[k]!=c[k]).sort(()=>Math.random()-.5).slice(0,3)).sort(()=>Math.random()-.5),a:null}}
function quiz(){const p=pool(),r=qm=="t2h";let h=sel()+'<button class="b s" data-a="qm" style="margin:0 0 8px">'+(r?"Режим: перевод → иероглиф":"Режим: иероглиф → перевод")+'</button>';
if(p.length<2)return h+'<p class="em">Для теста нужно минимум две карточки в колоде.</p>';
if(!qz||!p.some(c=>c.id==qz.c.id))newQ();const d=qz.a!=null;
h+=r?'<div class="ex tr" style="margin:12px 0">'+esc(qz.c.t)+'</div>':'<div class="mi" style="cursor:default"><span style="font-size:'+fs(qz.c.h)+'px">'+esc(qz.c.h)+'</span></div>';
h+='<div class="pin">'+(d?esc(qz.c.p):"")+'</div><div class="ops">'+qz.o.map((c,i)=>'<button class="op'+(r?" zh":"")+' '+(d?(c.id==qz.c.id?"ok":i==qz.a?"no":""):"")+'" data-a="ans" data-i="'+i+'"'+(d?" disabled":"")+'>'+esc(r?c.h:c.t)+'</button>').join("")+'</div>';
return h+(d?'<button class="b" data-a="nq">Дальше</button>':"")+'<p class="mu c">Верно: '+score[0]+' из '+score[1]+'</p>'}
function lst(){const k=sq.toLowerCase();return pool().filter(c=>!k||(c.h+c.p+c.t).toLowerCase().indexOf(k)>=0).map(c=>'<div class="li"><span class="zh">'+esc(c.h)+'</span><div data-a="edit" data-id="'+esc(c.id)+'"><div>'+esc(c.t)+'</div><div class="mu">'+esc(c.p)+'</div></div><button data-a="del" data-id="'+esc(c.id)+'" aria-label="Удалить">×</button></li>'.replace("</li>","</div>")).join("")}
function pendView(h){return h+'<h2>Проверь перед сохранением: '+pend.length+'</h2>'+pend.map((o,i)=>'<div class="li" style="align-items:flex-start"><input type="checkbox" data-a="pk" data-i="'+i+'"'+(o.k?" checked":"")+'><div>'+["h","p","t"].map(k=>'<input type="text" data-a="pf" data-i="'+i+'" data-k="'+k+'" value="'+esc(o[k])+'">').join("")+'</div></div>').join("")+'<button class="b" data-a="psave">Сохранить отмеченные</button><button class="b s" data-a="pcancel">Отмена</button>'}
function words(){let h=sel();if(pend)return pendView(h);
h+=ai()?'<label class="b'+(busy?" dis":"")+'">'+(busy=="p"?"Распознаю, это займёт до минуты…":"Сфоткать или выбрать страницу с лексикой")+'<input type="file" accept="image/*" hidden data-a="photo"></label>':'<p class="mu">Добавление по фото работает внутри Claude или с твоим API-ключом (раздел внизу).</p>';
const e=ef||{},v=k=>esc(e[k]||"");
h+='<details'+(ef?" open":"")+'><summary>'+(ef?"Редактировать слово":"Добавить слово вручную")+'</summary>'+[["fh","Иероглиф","h"],["fp","Пиньинь","p"],["ft","Перевод","t"],["feh","Пример на китайском","eh"],["fep","Пиньинь примера","ep"],["fet","Перевод примера","et"]].map(a=>'<input type="text" id="'+a[0]+'" placeholder="'+a[1]+'" value="'+v(a[2])+'">').join("")+(ai()?'<button class="b s" data-a="fill">Дополнить через Claude</button>':"")+'<button class="b" data-a="add">Сохранить</button>'+(ef?'<button class="b s" data-a="cancel">Отмена</button>':"")+'</details>';
h+='<details><summary>Колоды, копия, ключ</summary><input type="text" id="nd" placeholder="Новая колода, например Lesson 6"><button class="b s" data-a="nd">Создать колоду</button><button class="b s" data-a="exp2">Сохранить копию в файл</button><label class="b s">Загрузить копию из файла<input type="file" accept=".json" hidden data-a="imp"></label>'+(S?"":'<p class="mu">Чтобы Claude работал вне приложения Claude, вставь API-ключ из console.anthropic.com. Он хранится только на этом устройстве, использование оплачивается отдельно.</p><input type="text" id="ky" placeholder="sk-ant-..." value="'+esc(DB.key)+'"><button class="b s" data-a="key">Сохранить ключ</button>')+'</details>';
const p=pool();
return h+'<h2>Слов: '+p.length+', выучено: '+p.filter(c=>c.box>=4).length+'</h2><input type="text" id="sq" data-a="sq" placeholder="Поиск" value="'+esc(sq)+'"><div id="ls">'+lst()+'</div>'}
function chatView(){if(!ai())return'<p class="em">Чат работает внутри Claude или с твоим API-ключом (вкладка «Слова», раздел внизу).</p>';
return(chat.length?"":'<p class="em">Спроси про слово, грамматику или попроси составить диалог.</p>')+chat.map(m=>'<div class="'+(m.role=="user"?"me":"ex")+'">'+esc(m.content)+'</div>').join("")+(busy=="c"?'<p class="mu">Claude думает…</p>':"")+'<input type="text" id="ci" placeholder="Твой вопрос"><button class="b" data-a="send">Отправить</button>'}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));$("#v").innerHTML=tab=="study"?study():tab=="quiz"?quiz():tab=="words"?words():chatView()}
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(b)});
async function llm(p,imgs){
if(S){const r=await S(p,imgs?{images:imgs}:{});return r.text||""}
if(!DB.key)throw new Error("nokey");
const m=typeof p=="string"?[{role:"user",content:p}]:p.map(x=>({role:x.role,content:x.content})),L=m[m.length-1];
if(imgs)L.content=(await Promise.all(imgs.map(b64))).map(d=>({type:"image",source:{type:"base64",media_type:"image/jpeg",data:d}})).concat([{type:"text",text:L.content}]);
const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":DB.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:4000,messages:m})});
const j=await r.json();if(!r.ok)throw new Error("api");return j.content.map(x=>x.text||"").join("")}
async function arr(p,imgs){const t=await llm(p,imgs),a=t.indexOf("["),b=t.lastIndexOf("]");if(a<0||b<a)throw new Error("bad");return JSON.parse(t.slice(a,b+1))}
function shrink(f){return new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,1800/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.85)};i.onerror=rej;i.src=u})}
async function photo(f){if(!f||busy)return;busy="p";render();
try{const r=await arr(P+" Найди на фото все слова из списка лексики, включая имена собственные, и сделай карточку для каждого. Пример бери с фото, если он там есть, иначе придумай простой.",[await shrink(f)]),d=DB.deck||G;pend=r.filter(o=>o&&o.h).map(o=>Object.assign({},o,{k:!dup(o.h,d)}));if(!pend.length){pend=null;toast("Слов не нашёл")}}catch(e){toast(e.message=="nokey"||e.message=="api"?err(e):"Не получилось распознать. Попробуй фото почётче.")}
busy="";render()}
function add(){const g=i=>$("#"+i).value.trim(),o={h:g("fh"),p:g("fp"),t:g("ft"),eh:g("feh"),ep:g("fep"),et:g("fet")};if(!o.h)return toast("Впиши иероглиф");
if(ef){Object.assign(DB.cards.find(c=>c.id==ef.id),o);ef=null;toast("Сохранено")}else{if(dup(o.h,DB.deck||G))return toast("Такая карточка уже есть");DB.cards.push(mk(o));toast("Карточка добавлена")}save();render()}
async function fill(){const h=$("#fh").value.trim();if(!h)return toast("Сначала впиши иероглиф");toast("Дополняю…");
try{const o=(await arr(P+" Слово: "+h+". Верни массив из одного элемента."))[0];[["fp","p"],["ft","t"],["feh","eh"],["fep","ep"],["fet","et"]].forEach(a=>{if(!$("#"+a[0]).value)$("#"+a[0]).value=o[a[1]]||""});toast("Готово, проверь и сохрани")}catch(e){toast(err(e))}}
async function explain(){if(busy)return;busy="x";render();try{expl=await llm("Объясни китайское слово "+cur.h+" ("+cur.p+", "+cur.t+") студенту HSK 4: как употребляется, частые сочетания, чем отличается от похожих слов, два коротких примера с пиньинем и переводом. Кратко, по-русски.")}catch(e){expl=err(e)}busy="";render()}
async function send(){const i=$("#ci"),t=i.value.trim();if(!t||busy)return;chat.push({role:"user",content:t});busy="c";render();
try{const hist=chat.map((m,j)=>j?m:{role:m.role,content:SYS+"\n\n"+m.content});chat.push({role:"assistant",content:await llm(hist)})}catch(e){chat.push({role:"assistant",content:err(e)})}busy="";render()}
async function exp2(){const data=JSON.stringify({cards:DB.cards,decks:DB.decks});try{const d=window.claude&&await claude.use("downloads");if(d){await d.save({filename:"hanzi-cards.json",data:data});return}}catch(e){}
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download="hanzi-cards.json";a.click()}
async function imp(f){if(!f)return;try{const o=JSON.parse(await f.text());let n=0;(o.cards||[]).forEach(c=>{if(c&&c.h&&!dup(c.h,c.d||G)){DB.cards.push(Object.assign({d:G,box:0,due:0,id:Date.now()+Math.random().toString(36).slice(2,6)},c));n++}});(o.decks||[]).forEach(d=>{if(DB.decks.indexOf(d)<0)DB.decks.push(d)});save();toast("Добавлено карточек: "+n);render()}catch(e){toast("Не удалось прочитать файл")}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.tagName=="INPUT"||t.tagName=="SELECT")return;const a=t.dataset.a;
if(a=="tab"){tab=t.dataset.t;ef=null;if(tab=="study")startStudy();else render()}
else if(a=="flip"){flip=!flip;render()}
else if(a=="r")rate(+t.dataset.r)
else if(a=="again"){q=pool().sort(()=>Math.random()-.5);next()}
else if(a=="ans"){const i=+t.dataset.i;qz.a=i;score[1]++;if(qz.o[i].id==qz.c.id)score[0]++;else{qz.c.box=0;qz.c.due=0;save()}render()}
else if(a=="nq"){qz=null;render()}
else if(a=="qm"){qm=qm=="h2t"?"t2h":"h2t";qz=null;render()}
else if(a=="add")add()
else if(a=="fill")fill()
else if(a=="exp")explain()
else if(a=="send")send()
else if(a=="edit"){ef=Object.assign({},DB.cards.find(c=>c.id==t.dataset.id));render();scrollTo(0,0)}
else if(a=="cancel"){ef=null;render()}
